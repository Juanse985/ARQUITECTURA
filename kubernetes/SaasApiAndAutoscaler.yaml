# ============================================================================
# ARCHIVO: kubernetes/SaasApiAndAutoscaler.yaml
# CASO 8: CLOUD NATIVE - DESPLIEGUE GRADUAL (ZERO-DOWNTIME) Y AUTOESCALADO
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saas-tenant-api
  namespace: saas-data-plane
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  selector:
    matchLabels:
      app: saasTenantApi
  template:
    metadata:
      labels:
        app: saasTenantApi
        tier: backendApi
        version: "v2.0.0"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: saasTenantApi
      containers:
        - name: api
          image: registry.enterprise.io/saas/tenant-api:v2.0.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_POOLER_HOST
              value: "pg-bouncer-pooler.saas-data-plane.svc.cluster.local"
            - name: REDIS_RATELIMIT_HOST
              value: "redis-rate-limiter.saas-data-plane.svc.cluster.local"
            - name: DATABASE_NAME
              value: "saasCloudDb"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: saas-tenant-api-hpa
  namespace: saas-data-plane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: saas-tenant-api
  minReplicas: 6
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
